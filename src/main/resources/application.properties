spring.application.name=security
server.port=8081

#Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/pdf_automation
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#JWT utilities
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

# Kafka JSON Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Topics
application.kafka.topic.pdf-request=pdf-topic
application.kafka.topic.pdf-response=pdf-response

# Producer JSON serializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer JSON deserializer
spring.kafka.consumer.group-id=spring-pdf-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Allow JSON for all packages
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Parallel consumers
spring.kafka.listener.concurrency=3

# Upload File Path
application.file.upload-dir=${UPLOAD_PATH:./uploads/}

# Google OAuth2
# Get these from: https://console.cloud.google.com
# Authorized redirect URI to add in Google Console: http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# After Google login, redirect to Next.js at this URL with ?token=...
application.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
