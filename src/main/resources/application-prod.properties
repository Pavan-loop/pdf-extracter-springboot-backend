# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── HikariCP Connection Pool ──────────────────────────────────
spring.datasource.hikari.pool-name=PDFExtractorPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

# ── Logging ───────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.madara=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── Server ────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── S3 Storage ────────────────────────────────────────────────
application.storage.s3.bucket=${AWS_BUCKET_NAME}
application.storage.s3.region=${AWS_REGION:us-east-1}

# ── Stripe ────────────────────────────────────────────────────
application.stripe.secret-key=${STRIPE_SECRET_KEY}
application.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
application.stripe.price-id=${STRIPE_PRICE_ID}
application.stripe.success-url=${STRIPE_SUCCESS_URL}
application.stripe.cancel-url=${STRIPE_CANCEL_URL}
